# Custom ALSA sink configuration for PipeWire
# Place in ~/.config/pipewire/pipewire.conf.d/ or /etc/pipewire/pipewire.conf.d/
#
# This creates a PipeWire sink that opens the ALSA device directly via hw:X,
# bypassing the WirePlumber auto-detection and the ALSA front:X mixer layer.
#
# USE CASE: Users who need explicit control over buffer sizes, format, or
# resampling quality. Also useful as a diagnostic tool to compare noise
# profiles between hw:X (direct DAC) and front:X (via ALSA mixer).
#
# PITFALLS:
# - hw:X paths bypass the ALSA mixer, so hardware volume control is lost.
#   Volume must be controlled in software (PipeWire/PulseAudio).
# - hw:X references ALSA card numbers which can shift if card topology changes
#   (e.g., NVIDIA audio unbound/rebound makes PCH card# change).
# - Multiple sinks for the same hardware can confuse routing — check
#   default.audio.sink in ~/.config/pipewire/pipewire.conf.
# - A stuck SUSPENDED state after card topology changes requires
#   systemctl --user restart pipewire pipewire-pulse.

context.objects = [
    {
        factory = adapter
        args = {
            factory.name     = "api.alsa.pcm.sink"
            node.name        = "alc1220-analog-sink"
            node.description = "ALC1220 Analog (Custom Config)"
            media.class      = "Audio/Sink"

            # Use hw:X for direct DAC access (bypasses ALSA mixer layer)
            # Use front:X to go through ALSA mixer (hardware volume control)
            api.alsa.path    = "hw:1"

            api.alsa.pcm.stream = "playback"

            # Format: S32_LE matches ALC1220 native 32-bit DAC
            # F32_LE adds an unnecessary conversion step (PipeWire converts
            # F32_LE -> S32_LE for the hardware)
            audio.format     = "S32_LE"
            audio.channels   = 2
            audio.position   = "FL,FR"
            audio.rate       = 48000

            # Resampler: soxr-vhq is highest quality but loads CPU
            # If all audio is 48kHz (matching the configured rate),
            # no resampling occurs and the quality setting doesn't matter.
            # Drop to soxr-hq or speex-float-10 to save CPU.
            resample.quality = "soxr-vhq"

            # Buffer settings
            # period-size=512 -> ~10.7ms latency at 48kHz (good balance)
            # period-size=256 -> ~5.3ms for gaming (lower latency)
            # period-size=1024 -> ~21ms for stability
            api.alsa.period-size = 512

            # Number of periods (buffers): 2=double, 3=triple
            # More = more underrun protection, more latency
            api.alsa.periods = 3

            # Headroom in frames — add 64-128 to prevent buffer underruns
            # during GPU load spikes (coil whine scenario)
            api.alsa.headroom = 64

            monitor.passthrough = false
        }
    }
]
