# Hermes Dashboard theme using locally-installed Apple SF fonts.
# Fonts live at /usr/share/fonts/apple-fonts/ — no external stylesheet needed.
# Verify with: fc-list | grep -i "SF Pro\|SF Mono"

name: sf
label: SF Fonts
description: Apple SF Pro (sans) + SF Mono (mono) from local system fonts

palette:
  background:
    hex: "#041c1c"
    alpha: 1.0
  midground:
    hex: "#ffe6cb"
    alpha: 1.0
  foreground:
    hex: "#ffffff"
    alpha: 0.0
  warmGlow: "rgba(255, 189, 56, 0.35)"
  noiseOpacity: 1.0

typography:
  fontSans: '"SF Pro Text", "SF Pro Display", "SF Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  fontMono: '"SF Mono", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace'
  fontDisplay: '"SF Pro Display", "SF Pro Text", "SF Pro", system-ui, -apple-system, sans-serif'
  baseSize: "15px"
  lineHeight: "1.55"
  letterSpacing: "0"

layout:
  radius: "0.5rem"
  density: comfortable
